<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin It — Truth or Dare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f2ecdf;
    --ink-dim:#c9c0ad;
    --night:#141022;
    --night-2:#1c1730;
    --card:#231c3a;
    --truth:#63c9b5;
    --truth-glow:rgba(99,201,181,.35);
    --dare:#ff6f5e;
    --dare-glow:rgba(255,111,94,.35);
    --gold:#e8b84f;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 18% 10%, rgba(99,201,181,.10), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(255,111,94,.10), transparent 45%),
      var(--night);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    overflow-x:hidden;
  }

  .wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:48px 20px 60px;
    position:relative;
  }

  /* header */
  .eyebrow{
    font-size:12px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:14px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(34px, 6vw, 56px);
    line-height:1.02;
    margin:0 0 10px;
    text-align:center;
    letter-spacing:-.01em;
  }
  h1 em{
    font-style:italic;
    background:linear-gradient(95deg, var(--truth), var(--dare));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    color:var(--ink-dim);
    font-size:15px;
    text-align:center;
    max-width:420px;
    margin:0 0 44px;
    line-height:1.55;
  }
  .legend{
    display:flex;
    gap:22px;
    margin-bottom:6px;
  }
  .legend span{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.t{background:var(--truth);}
  .dot.d{background:var(--dare);}

  /* wheel */
  .stage{
    position:relative;
    width:min(340px, 78vw);
    height:min(340px, 78vw);
    margin:38px 0 34px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .pointer{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:12px solid transparent;
    border-right:12px solid transparent;
    border-top:20px solid var(--gold);
    filter:drop-shadow(0 2px 6px rgba(232,184,79,.5));
    z-index:5;
  }

  .ring-outer{
    position:absolute;
    inset:0;
    border-radius:50%;
    padding:10px;
    background:conic-gradient(
      var(--truth) 0deg 25.2deg, var(--dare) 25.2deg 50.4deg,
      var(--truth) 50.4deg 75.6deg, var(--dare) 75.6deg 100.8deg,
      var(--truth) 100.8deg 126deg, var(--dare) 126deg 151.2deg,
      var(--truth) 151.2deg 176.4deg, var(--dare) 176.4deg 201.6deg,
      var(--truth) 201.6deg 226.8deg, var(--dare) 226.8deg 252deg,
      var(--truth) 252deg 277.2deg, var(--dare) 277.2deg 302.4deg,
      var(--truth) 302.4deg 327.6deg, var(--dare) 327.6deg 352.8deg,
      var(--truth) 352.8deg 360deg
    );
    box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 30px 60px -20px rgba(0,0,0,.6);
    transition: transform 3.2s cubic-bezier(.15,.65,.15,1);
    will-change: transform;
  }
  .ring-outer::before{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    background:var(--night-2);
  }
  .ring-outer.spinning{
    animation:none;
  }

  .hub{
    position:relative;
    z-index:3;
    width:62%;
    height:62%;
    border-radius:50%;
    background:linear-gradient(160deg, #2a2245, #1a1530);
    border:1px solid rgba(255,255,255,.08);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: inset 0 2px 10px rgba(255,255,255,.06), inset 0 -12px 24px rgba(0,0,0,.5);
  }

  #spinBtn{
    width:82%;
    height:82%;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #ffd98a, var(--gold) 55%, #b8862c 100%);
    color:#241a06;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:.02em;
    box-shadow:0 10px 24px -6px rgba(232,184,79,.55), inset 0 -4px 8px rgba(0,0,0,.2);
    transition: transform .15s ease, box-shadow .15s ease, filter .3s ease;
  }
  #spinBtn:hover{transform:scale(1.035);}
  #spinBtn:active{transform:scale(.97);}
  #spinBtn:disabled{
    cursor:default;
    filter:grayscale(.35) brightness(.85);
    transform:none;
  }

  .pulse{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:1px solid var(--gold);
    opacity:0;
  }
  .stage.active .pulse{
    animation: pulse 1.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{opacity:.5; transform:scale(1);}
    100%{opacity:0; transform:scale(1.35);}
  }

  /* result card */
  .result{
    width:min(480px, 92vw);
    background:var(--card);
    border-radius:20px;
    padding:30px 28px 26px;
    border:1px solid rgba(255,255,255,.06);
    box-shadow:0 30px 60px -30px rgba(0,0,0,.7);
    opacity:0;
    transform:translateY(14px) scale(.98);
    transition:opacity .5s ease, transform .5s ease;
    text-align:center;
  }
  .result.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  .result .tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-weight:700;
    padding:6px 14px;
    border-radius:99px;
    margin-bottom:16px;
  }
  .result .tag.truth{
    color:var(--truth);
    background:var(--truth-glow);
  }
  .result .tag.dare{
    color:var(--dare);
    background:var(--dare-glow);
  }
  .result .qnum{
    color:var(--ink-dim);
    font-size:12px;
    letter-spacing:.1em;
    margin-bottom:10px;
  }
  .result p{
    font-family:'Fraunces', serif;
    font-size:clamp(20px, 3.4vw, 25px);
    line-height:1.35;
    font-weight:600;
    margin:0;
  }

  .hint{
    margin-top:22px;
    font-size:13px;
    color:var(--ink-dim);
    text-align:center;
    min-height:18px;
  }

  footer{
    margin-top:auto;
    padding-top:50px;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#54506a;
  }

  @media (prefers-reduced-motion: reduce){
    .ring-outer{transition:none;}
    .pulse{animation:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Two Players · 50 Rounds</div>
  <h1>Truth <em>or</em> Dare</h1>
  <p class="sub">Spin the wheel. Whatever it lands on, you're doing — no rerolls, no mercy.</p>

  <div class="legend">
    <span><i class="dot t"></i>Truth</span>
    <span><i class="dot d"></i>Dare</span>
  </div>

  <div class="stage" id="stage">
    <div class="pulse"></div>
    <div class="pointer"></div>
    <div class="ring-outer" id="ring">
      <div class="hub">
        <button id="spinBtn">SPIN</button>
      </div>
    </div>
  </div>

  <div class="result" id="result">
    <div class="tag" id="tag">Truth</div>
    <div class="qnum" id="qnum">Round 1</div>
    <p id="question">Press spin to reveal your first question.</p>
  </div>

  <div class="hint" id="hint">Tap the wheel to begin.</div>

  <footer>50 Questions · Spun At Random</footer>
</div>

<script>
  const questions = [
    {n:1, type:'truth', q:"What's the most embarrassing thing on your phone right now?"},
    {n:2, type:'truth', q:"What's a secret guilty pleasure you've never told me about?"},
    {n:3, type:'truth', q:"Who was your first celebrity crush?"},
    {n:4, type:'truth', q:"What's the worst date you ever went on before me?"},
    {n:5, type:'truth', q:"Have you ever pretended to be busy when I called just so you could have alone time?"},
    {n:6, type:'truth', q:"What's the most useless thing you've bought online during our relationship?"},
    {n:7, type:'truth', q:"What's a weird food combination you actually love?"},
    {n:8, type:'truth', q:"Have you ever muted my notifications on purpose?"},
    {n:9, type:'truth', q:"What's the most childish thing you still do when no one's watching?"},
    {n:10, type:'truth', q:"What's a dream you've had about me that you never told me?"},
    {n:11, type:'truth', q:"Who's the worst driver you've ever known?"},
    {n:12, type:'truth', q:"What's the most embarrassing song on your playlist?"},
    {n:13, type:'truth', q:"Have you ever screenshot my texts and sent them to a friend for advice?"},
    {n:14, type:'truth', q:"What's the longest you've gone without replying to me and why?"},
    {n:15, type:'truth', q:"What's a skill you wish I had but don't?"},
    {n:16, type:'truth', q:"What's the most boring thing you find fascinating?"},
    {n:17, type:'truth', q:"Have you ever pretended to understand something I explained when you didn't?"},
    {n:18, type:'truth', q:"What's the worst haircut you've ever had?"},
    {n:19, type:'truth', q:"What's your most irrational fear?"},
    {n:20, type:'truth', q:"Have you ever re-gifted something I sent you (or thought about it)?"},
    {n:21, type:'truth', q:"What's a cringe memory from high school that still haunts you?"},
    {n:22, type:'truth', q:"What's the last thing you googled that you'd be embarrassed for me to see?"},
    {n:23, type:'truth', q:"What's the most overrated movie we've both seen?"},
    {n:24, type:'truth', q:"Have you ever lied about having bad signal to end a call?"},
    {n:25, type:'truth', q:"What's one thing you've lied to your mom about regarding me?"},
    {n:26, type:'dare', q:"Share your screen and scroll through your Instagram Explore page for 10 seconds."},
    {n:27, type:'dare', q:"Share your screen and let me see your last 5 open browser tabs."},
    {n:28, type:'dare', q:"Screenshot a random chat (anyone) and show me the last 3 messages."},
    {n:29, type:'dare', q:"Do your best impression of me for 30 seconds on video."},
    {n:30, type:'dare', q:'Send a text to your mom saying "I love you" with zero context — screenshot proof required.'},
    {n:31, type:'dare', q:"Let me pick a filter on your phone and you have to post it to your story."},
    {n:32, type:'dare', q:"Speak in a British accent for the next 3 rounds of the game."},
    {n:33, type:'dare', q:"Share your screen and show me your phone's battery usage for the last 24h."},
    {n:34, type:'dare', q:"Let me pick an emoji and you send it to your last text conversation — no explanations."},
    {n:35, type:'dare', q:"Do 10 push-ups on camera right now."},
    {n:36, type:'dare', q:"Change your phone wallpaper to something silly I choose — show me and keep it for 1 hour."},
    {n:37, type:'dare', q:"Share your screen and show me your recent emojis — explain the top 3."},
    {n:38, type:'dare', q:"Sing the chorus of the last song you listened to, on video."},
    {n:39, type:'dare', q:"Let me read your last 3 DMs on any social media app (screen-share)."},
    {n:40, type:'dare', q:"Put on a silly hat or accessory I choose and keep it for 5 minutes on call."},
    {n:41, type:'dare', q:"Screenshot your weather app and guess tomorrow's weather out loud."},
    {n:42, type:'dare', q:'Let me send a voice note to one of your group chats saying "guess what" and nothing else — show me after.'},
    {n:43, type:'dare', q:"Do a dramatic reading of the last text I sent you."},
    {n:44, type:'dare', q:'Screenshot your "recently deleted" camera roll folder and show me (no judgment!).'},
    {n:45, type:'dare', q:"I pick your next snack — you have to eat it on camera."},
    {n:46, type:'dare', q:"Share your screen and show me your most used app (screen time) — explain why."},
    {n:47, type:'dare', q:"Let me pick a caption, and you post a photo of us (or anything) to your story with it."},
    {n:48, type:'dare', q:"Do your best robot dance for 15 seconds on video."},
    {n:49, type:'dare', q:"Screenshot your notes app and show me the last note."},
    {n:50, type:'dare', q:"Switch phones for 5 minutes — we scroll through each other's home screens via screen-share (no opening private apps)."},
  ];

  const ring = document.getElementById('ring');
  const stage = document.getElementById('stage');
  const btn = document.getElementById('spinBtn');
  const result = document.getElementById('result');
  const tag = document.getElementById('tag');
  const qnum = document.getElementById('qnum');
  const question = document.getElementById('question');
  const hint = document.getElementById('hint');

  let currentRotation = 0;
  let remaining = shuffle([...Array(50).keys()]);
  let spinning = false;

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function pickIndex(){
    if(remaining.length === 0){
      remaining = shuffle([...Array(50).keys()]);
    }
    return remaining.pop();
  }

  btn.addEventListener('click', () => {
    if(spinning) return;
    spinning = true;
    btn.disabled = true;
    stage.classList.add('active');
    hint.textContent = 'Spinning…';
    result.classList.remove('show');

    // truly random pick — decided AFTER the spin starts, unrelated to visual stop angle
    const idx = pickIndex();

    // random spin: 5-8 full rotations plus random offset, purely cosmetic
    const extraTurns = 5 + Math.floor(Math.random() * 4);
    const randomOffset = Math.random() * 360;
    currentRotation += extraTurns * 360 + randomOffset;
    ring.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      const item = questions[idx];
      tag.textContent = item.type === 'truth' ? 'Truth' : 'Dare';
      tag.className = 'tag ' + item.type;
      qnum.textContent = 'Round ' + item.n + ' of 50';
      question.textContent = item.q;
      result.classList.add('show');
      hint.textContent = 'Tap the wheel to spin again.';
      stage.classList.remove('active');
      btn.disabled = false;
      spinning = false;
    }, 3300);
  });
</script>
</body>
</html>
