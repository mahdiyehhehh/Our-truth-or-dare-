<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin It — Truth or Dare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* palette lifted from the Botanica brand board */
    --cream:#ECE6D8;
    --cream-2:#F6F2E8;
    --ink:#26241A;
    --ink-dim:#8B8770;
    --olive:#68702F;
    --olive-2:#9AA35A;
    --rose:#C97D93;
    --rose-2:#E7B4C0;
    --maroon:#7C2A3B;
    --gold:#B4893F;
    --line: rgba(38,36,26,.10);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:var(--cream);
    color:var(--ink);
    font-family:'Instrument Sans', sans-serif;
    overflow-x:hidden;
  }

  .wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:52px 20px 60px;
    position:relative;
  }

  /* header */
  .eyebrow{
    font-size:11px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--maroon);
    font-weight:600;
    margin-bottom:16px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(36px, 6vw, 58px);
    line-height:1.0;
    margin:0 0 12px;
    text-align:center;
    letter-spacing:-.01em;
    color:var(--ink);
  }
  h1 em{
    font-style:italic;
    color:var(--maroon);
  }
  .sub{
    color:var(--ink-dim);
    font-size:15px;
    text-align:center;
    max-width:420px;
    margin:0 0 40px;
    line-height:1.55;
  }
  .legend{
    display:flex;
    gap:24px;
    margin-bottom:8px;
  }
  .legend span{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:600;
  }
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.t{background:var(--olive);}
  .dot.d{background:var(--maroon);}

  /* wheel */
  .stage{
    position:relative;
    width:min(380px, 88vw);
    height:min(380px, 88vw);
    margin:40px 0 36px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .pointer{
    position:absolute;
    top:-4px;
    left:50%;
    transform:translateX(-50%);
    width:26px;
    height:26px;
    background:var(--ink);
    clip-path: polygon(50% 100%, 0 0, 100% 0);
    z-index:6;
  }

  .wheel{
    position:absolute;
    inset:0;
    border-radius:50%;
    box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 40px 70px -30px rgba(38,36,26,.45);
    transition: transform 3.4s cubic-bezier(.12,.66,.1,1);
    will-change: transform;
  }

  .wheel-face{
    position:absolute;
    inset:0;
    border-radius:50%;
    overflow:hidden;
  }

  .spoke{
    position:absolute;
    top:50%;
    left:50%;
    height:14px;
    width:47%;
    transform-origin:0% 50%;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:14px;
    pointer-events:none;
  }
  .spoke span{
    font-size:9.5px;
    font-weight:600;
    letter-spacing:.05em;
    white-space:nowrap;
    display:inline-block;
    transform-origin:center;
  }
  .spoke.t span{color:var(--cream-2);}
  .spoke.d span{color:var(--cream-2);}

  .rim{
    position:absolute;
    inset:-2px;
    border-radius:50%;
    border:2px solid var(--cream);
    pointer-events:none;
  }

  /* center hub — stays put, never rotates. split into two half-circle buttons */
  .hub{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:8;
    width:34%;
    height:34%;
    border-radius:50%;
    overflow:hidden;
    display:flex;
    box-shadow: 0 10px 24px -8px rgba(38,36,26,.35), 0 0 0 6px var(--cream);
  }

  .hub-btn{
    flex:1;
    height:100%;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Instrument Sans', sans-serif;
    font-weight:700;
    font-size:clamp(10.5px, 2.6vw, 13px);
    letter-spacing:.05em;
    text-transform:uppercase;
    line-height:1.2;
    transition: filter .2s ease, transform .15s ease;
    position:relative;
  }
  .hub-btn.truth{
    background:var(--olive);
    color:var(--cream-2);
  }
  .hub-btn.dare{
    background:var(--maroon);
    color:var(--cream-2);
  }
  .hub-btn.truth::after{
    content:"";
    position:absolute;
    top:0; right:0;
    width:1px;
    height:100%;
    background:rgba(236,230,216,.4);
  }
  .hub-btn:hover{filter:brightness(1.08);}
  .hub-btn:active{filter:brightness(.94);}
  .hub-btn:disabled{
    cursor:default;
    filter:grayscale(.45) brightness(.8);
  }

  /* result card */
  .result{
    width:min(480px, 92vw);
    background:var(--cream-2);
    border-radius:18px;
    padding:30px 28px 26px;
    border:1px solid var(--line);
    box-shadow:0 30px 60px -35px rgba(38,36,26,.4);
    opacity:0;
    transform:translateY(14px) scale(.98);
    transition:opacity .5s ease, transform .5s ease;
    text-align:center;
  }
  .result.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  .result .tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-weight:700;
    padding:6px 14px;
    border-radius:99px;
    margin-bottom:16px;
  }
  .result .tag.truth{
    color:var(--cream-2);
    background:var(--olive);
  }
  .result .tag.dare{
    color:var(--cream-2);
    background:var(--maroon);
  }
  .result .qnum{
    color:var(--ink-dim);
    font-size:12px;
    letter-spacing:.1em;
    margin-bottom:10px;
  }
  .result p{
    font-family:'Fraunces', serif;
    font-size:clamp(20px, 3.4vw, 25px);
    line-height:1.35;
    font-weight:500;
    margin:0;
    color:var(--ink);
  }

  .copy-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:20px;
    padding:9px 16px;
    border-radius:99px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-dim);
    font-family:'Instrument Sans', sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    text-transform:uppercase;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease, background .2s ease;
  }
  .copy-btn svg{
    width:14px;
    height:14px;
    flex:none;
  }
  .copy-btn:hover{
    border-color:var(--ink-dim);
    color:var(--ink);
  }
  .copy-btn.copied{
    border-color:var(--olive);
    color:var(--olive);
    background:rgba(104,112,47,.08);
  }

  .hint{
    margin-top:22px;
    font-size:13px;
    color:var(--ink-dim);
    text-align:center;
    min-height:18px;
  }

  footer{
    margin-top:auto;
    padding-top:50px;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  @media (prefers-reduced-motion: reduce){
    .wheel{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Two Players · 50 Rounds</div>
  <h1>Truth <em>or</em> Dare</h1>
  <p class="sub">Pick truth or dare. The wheel spins and lands on a random one from that pile — no rerolls, no mercy.</p>

  <div class="legend">
    <span><i class="dot t"></i>Truth</span>
    <span><i class="dot d"></i>Dare</span>
  </div>

  <div class="stage" id="stage">
    <div class="pointer"></div>
    <div class="wheel" id="wheel">
      <div class="wheel-face" id="wheelFace"></div>
      <div class="rim"></div>
    </div>
    <div class="hub">
      <button class="hub-btn truth" id="truthBtn">Truth</button>
      <button class="hub-btn dare" id="dareBtn">Dare</button>
    </div>
  </div>

  <div class="result" id="result">
    <div class="tag" id="tag">Truth</div>
    <div class="qnum" id="qnum">Round 1</div>
    <p id="question">Press spin to reveal your first question.</p>
    <button class="copy-btn" id="copyBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      <span id="copyLabel">Copy question</span>
    </button>
  </div>

  <div class="hint" id="hint">Pick truth or dare to begin.</div>

  <footer>50 Questions · Spun At Random</footer>
</div>

<script>
  const questions = [
    {n:1, type:'truth', q:"What's the most embarrassing thing on your phone right now?"},
    {n:2, type:'truth', q:"What's a secret guilty pleasure you've never told me about?"},
    {n:3, type:'truth', q:"Who was your first celebrity crush?"},
    {n:4, type:'truth', q:"What's the worst date you ever went on before me?"},
    {n:5, type:'truth', q:"Have you ever pretended to be busy when I called just so you could have alone time?"},
    {n:6, type:'truth', q:"What's the most useless thing you've bought online during our relationship?"},
    {n:7, type:'truth', q:"What's a weird food combination you actually love?"},
    {n:8, type:'truth', q:"Have you ever muted my notifications on purpose?"},
    {n:9, type:'truth', q:"What's the most childish thing you still do when no one's watching?"},
    {n:10, type:'truth', q:"What's a dream you've had about me that you never told me?"},
    {n:11, type:'truth', q:"Who's the worst driver you've ever known?"},
    {n:12, type:'truth', q:"What's the most embarrassing song on your playlist?"},
    {n:13, type:'truth', q:"Have you ever screenshot my texts and sent them to a friend for advice?"},
    {n:14, type:'truth', q:"What's the longest you've gone without replying to me and why?"},
    {n:15, type:'truth', q:"What's a skill you wish I had but don't?"},
    {n:16, type:'truth', q:"What's the most boring thing you find fascinating?"},
    {n:17, type:'truth', q:"Have you ever pretended to understand something I explained when you didn't?"},
    {n:18, type:'truth', q:"What's the worst haircut you've ever had?"},
    {n:19, type:'truth', q:"What's your most irrational fear?"},
    {n:20, type:'truth', q:"Have you ever re-gifted something I sent you (or thought about it)?"},
    {n:21, type:'truth', q:"What's a cringe memory from high school that still haunts you?"},
    {n:22, type:'truth', q:"What's the last thing you googled that you'd be embarrassed for me to see?"},
    {n:23, type:'truth', q:"What's the most overrated movie we've both seen?"},
    {n:24, type:'truth', q:"Have you ever lied about having bad signal to end a call?"},
    {n:25, type:'truth', q:"What's one thing you've lied to your mom about regarding me?"},
    {n:26, type:'dare', q:"Share your screen and scroll through your Instagram Explore page for 10 seconds."},
    {n:27, type:'dare', q:"Share your screen and let me see your last 5 open browser tabs."},
    {n:28, type:'dare', q:"Screenshot a random chat (anyone) and show me the last 3 messages."},
    {n:29, type:'dare', q:"Do your best impression of me for 30 seconds on video."},
    {n:30, type:'dare', q:'Send a text to your mom saying "I love you" with zero context — screenshot proof required.'},
    {n:31, type:'dare', q:"Let me pick a filter on your phone and you have to post it to your story."},
    {n:32, type:'dare', q:"Speak in a British accent for the next 3 rounds of the game."},
    {n:33, type:'dare', q:"Share your screen and show me your phone's battery usage for the last 24h."},
    {n:34, type:'dare', q:"Let me pick an emoji and you send it to your last text conversation — no explanations."},
    {n:35, type:'dare', q:"Do 10 push-ups on camera right now."},
    {n:36, type:'dare', q:"Change your phone wallpaper to something silly I choose — show me and keep it for 1 hour."},
    {n:37, type:'dare', q:"Share your screen and show me your recent emojis — explain the top 3."},
    {n:38, type:'dare', q:"Sing the chorus of the last song you listened to, on video."},
    {n:39, type:'dare', q:"Let me read your last 3 DMs on any social media app (screen-share)."},
    {n:40, type:'dare', q:"Put on a silly hat or accessory I choose and keep it for 5 minutes on call."},
    {n:41, type:'dare', q:"Screenshot your weather app and guess tomorrow's weather out loud."},
    {n:42, type:'dare', q:'Let me send a voice note to one of your group chats saying "guess what" and nothing else — show me after.'},
    {n:43, type:'dare', q:"Do a dramatic reading of the last text I sent you."},
    {n:44, type:'dare', q:'Screenshot your "recently deleted" camera roll folder and show me (no judgment!).'},
    {n:45, type:'dare', q:"I pick your next snack — you have to eat it on camera."},
    {n:46, type:'dare', q:"Share your screen and show me your most used app (screen time) — explain why."},
    {n:47, type:'dare', q:"Let me pick a caption, and you post a photo of us (or anything) to your story with it."},
    {n:48, type:'dare', q:"Do your best robot dance for 15 seconds on video."},
    {n:49, type:'dare', q:"Screenshot your notes app and show me the last note."},
    {n:50, type:'dare', q:"Switch phones for 5 minutes — we scroll through each other's home screens via screen-share (no opening private apps)."},
  ];

  const wheel = document.getElementById('wheel');
  const wheelFace = document.getElementById('wheelFace');
  const truthBtn = document.getElementById('truthBtn');
  const dareBtn = document.getElementById('dareBtn');
  const result = document.getElementById('result');
  const tag = document.getElementById('tag');
  const qnum = document.getElementById('qnum');
  const question = document.getElementById('question');
  const hint = document.getElementById('hint');
  const copyBtn = document.getElementById('copyBtn');
  const copyLabel = document.getElementById('copyLabel');

  const N = questions.length; // 50
  const SLICE = 360 / N;      // 7.2deg per slice

  // ---- build the wedge colours (conic-gradient) from the brand palette ----
  const olive = ['#68702F', '#7C8A3D'];   // truth wedges, two alternating shades
  const maroonSet = ['#7C2A3B', '#9A3C4E']; // dare wedges, two alternating shades
  let stops = [];
  for(let i = 0; i < N; i++){
    const item = questions[i];
    const palette = item.type === 'truth' ? olive : maroonSet;
    const color = palette[i % 2];
    const start = (i * SLICE).toFixed(3);
    const end = ((i + 1) * SLICE).toFixed(3);
    stops.push(`${color} ${start}deg ${end}deg`);
  }
  // base wedge colours, plus a thin cream divider line layered on top of each slice edge
  wheelFace.style.backgroundImage =
    `repeating-conic-gradient(from 0deg, rgba(236,230,216,.5) 0deg 0.35deg, transparent 0.35deg ${SLICE}deg), ` +
    `conic-gradient(from 0deg, ${stops.join(', ')})`;

  // ---- build the radial spoke labels ----
  const spokeEls = [];
  for(let i = 0; i < N; i++){
    const item = questions[i];
    const centerAngle = i * SLICE + SLICE / 2; // clockwise from top, matches conic-gradient
    const cssRotate = centerAngle - 90; // spoke div's natural direction points right (east); shift to top-based system

    const spoke = document.createElement('div');
    spoke.className = 'spoke ' + item.type[0]; // 't' or 'd'
    spoke.style.transform = `rotate(${cssRotate}deg)`;
    spoke.dataset.angle = cssRotate;

    const label = document.createElement('span');
    const code = item.type === 'truth' ? 'T' : 'D';
    label.textContent = `${code}${String(item.n).padStart(2,'0')}`;
    spoke.appendChild(label);
    wheelFace.appendChild(spoke);
    spokeEls.push({ el: spoke, span: label, angle: cssRotate });
  }

  // keeps every number reading right-side-up on screen, no matter where the
  // wheel has rotated to — only the glyph is flipped, its position never moves
  function orientLabels(rotation){
    spokeEls.forEach(({ span, angle }) => {
      let screenAngle = (angle + rotation) % 360;
      if(screenAngle < 0) screenAngle += 360;
      const upsideDown = screenAngle > 90 && screenAngle < 270;
      span.style.transform = upsideDown ? 'rotate(180deg)' : 'rotate(0deg)';
    });
  }
  orientLabels(0);

  // ---- spin logic ----
  let currentRotation = 0;
  let spinning = false;

  const truthIndices = [];
  const dareIndices = [];
  questions.forEach((q, i) => (q.type === 'truth' ? truthIndices : dareIndices).push(i));

  let truthPool = shuffle([...truthIndices]);
  let darePool = shuffle([...dareIndices]);

  function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function pickFromPool(type){
    if(type === 'truth'){
      if(truthPool.length === 0) truthPool = shuffle([...truthIndices]);
      return truthPool.pop();
    } else {
      if(darePool.length === 0) darePool = shuffle([...dareIndices]);
      return darePool.pop();
    }
  }

  function spinTo(type){
    if(spinning) return;
    spinning = true;
    truthBtn.disabled = true;
    dareBtn.disabled = true;
    hint.textContent = type === 'truth' ? 'Spinning for a truth…' : 'Spinning for a dare…';
    result.classList.remove('show');

    // truly random pick from the chosen pool — then the wheel is rotated to land on it
    const idx = pickFromPool(type);
    const centerAngle = idx * SLICE + SLICE / 2;

    // rotation (mod 360) needed so this slice's centre sits under the top pointer
    const targetMod = (360 - centerAngle + 360) % 360;

    const extraTurns = 6 + Math.floor(Math.random() * 3); // 6-8 full spins
    const base = Math.floor(currentRotation / 360) * 360;
    let newRotation = base + extraTurns * 360 + targetMod;
    if(newRotation <= currentRotation) newRotation += 360;

    currentRotation = newRotation;
    wheel.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      orientLabels(currentRotation);
      const item = questions[idx];
      tag.textContent = item.type === 'truth' ? 'Truth' : 'Dare';
      tag.className = 'tag ' + item.type;
      qnum.textContent = 'Round ' + item.n + ' of 50';
      question.textContent = item.q;
      copyBtn.classList.remove('copied');
      copyLabel.textContent = 'Copy question';
      result.classList.add('show');
      hint.textContent = 'Pick truth or dare to go again.';
      truthBtn.disabled = false;
      dareBtn.disabled = false;
      spinning = false;
    }, 3500);
  }

  // ---- copy just the question text to the clipboard ----
  let copyResetTimer = null;
  function copyQuestion(){
    const text = question.textContent;
    const showCopied = () => {
      copyBtn.classList.add('copied');
      copyLabel.textContent = 'Copied!';
      clearTimeout(copyResetTimer);
      copyResetTimer = setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyLabel.textContent = 'Copy question';
      }, 1800);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
    } else {
      fallbackCopy(text, showCopied);
    }
  }
  function fallbackCopy(text, onDone){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    onDone();
  }
  copyBtn.addEventListener('click', copyQuestion);

  truthBtn.addEventListener('click', () => spinTo('truth'));
  dareBtn.addEventListener('click', () => spinTo('dare'));
</script>
</body>
</html>
